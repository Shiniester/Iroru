name: Build Android and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 4.4.1 or v4.4.1'
        required: true
        type: string
      release_notes:
        description: 'Release notes in Markdown'
        required: true
        type: string
      commit_sha:
        description: 'Exact 40-character commit SHA to release (defaults to the workflow dispatch commit)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: kikoflu-release
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      suffix: ${{ steps.version.outputs.suffix }}
      commit_sha: ${{ steps.resolve_commit.outputs.commit_sha }}
    steps:
      - name: Validate selected release commit
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_COMMIT_SHA" ] && [[ ! "$INPUT_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::commit_sha must be a full 40-character commit SHA.'
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - uses: actions/checkout@v6
        if: ${{ inputs.commit_sha && inputs.commit_sha != github.sha }}
        with:
          ref: ${{ github.sha }}
          path: .release-gate

      - name: Verify selected release source configuration
        run: |
          set -euo pipefail
          gate="scripts/ci/validate_release_source.py"
          if [[ -d .release-gate ]]; then
            gate=".release-gate/$gate"
          fi
          if [[ ! -f "$gate" ]]; then
            echo '::error::Selected commit predates the required release configuration. Choose a commit that includes the new release configuration.'
            exit 1
          fi
          if [[ ! -f scripts/ci/android_release.py ]]; then
            echo '::error::Selected commit predates the Android release APK helper. Choose a commit that includes the new release configuration.'
            exit 1
          fi
          python3 "$gate" android --root .

      - name: Resolve selected release commit
        id: resolve_commit
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Normalize and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH, for example 4.4.1."
            exit 1
          fi

          tag="v${version}"
          suffix="${version//./}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Choose a new version."
            exit 1
          fi

          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Git tag $tag already exists. Choose a new version."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "Building Android release $tag with filename suffix $suffix"

  native-audio:
    name: Build Android Native Audio Libraries
    needs: prepare
    uses: ./.github/workflows/native_audio.yml
    with:
      commit_sha: ${{ needs.prepare.outputs.commit_sha }}
      android_only: true
      android_all_abis: false

  android:
    name: Android Build
    needs: [prepare, native-audio]
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.package.outputs.apk_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Download Android libmpv artifacts
        uses: actions/download-artifact@v6
        with:
          name: native-audio-android
          path: build/native-audio/android-output

      - name: Set Application Version
        run: |
          sed -i.bak -E 's/^version: .*/version: ${{ needs.prepare.outputs.version }}/' pubspec.yaml
          rm pubspec.yaml.bak

      - name: Prepare Android Signing
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Required Android signing secret $secret_name is missing."
              exit 1
            fi
          done

          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          if [ ! -s android/app/release-key.jks ]; then
            echo "::error::Decoded Android release keystore is empty."
            exit 1
          fi
          cat <<EOF > android/key.properties
          storeFile=app/release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/app/release-key.jks android/key.properties
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true
          pub-cache: true

      - name: Cache Android Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ runner.arch }}-java-17-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}

      - name: Get Dependencies
        run: flutter pub get

      - name: Read Android base version code
        run: |
          set -euo pipefail
          flutter build apk --config-only --no-pub
          base_code="$(sed -n 's/^flutter\.versionCode=//p' android/local.properties | tail -n 1)"
          base_code="${base_code:-1}"
          if [[ ! "$base_code" =~ ^[0-9]+$ ]]; then
            echo '::error::Flutter did not write a valid base versionCode to android/local.properties.'
            exit 1
          fi
          echo "ANDROID_BASE_VERSION_CODE=$base_code" >> "$GITHUB_ENV"

      - name: Build Android APKs
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          apk_name="$(python3 scripts/ci/android_release.py name \
            --version "${{ needs.prepare.outputs.suffix }}" \
            --package-id com.meteor.iroru)"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/$apk_name"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Verify Android Package Compatibility
        env:
          APK_NAME: ${{ steps.package.outputs.apk_name }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          SIGNING_CONFIGURED: ${{ steps.android_signing.outputs.configured }}
        run: |
          set -euo pipefail
          python3 scripts/ci/android_release.py verify \
            --apk "dist/$APK_NAME" \
            --package-id com.meteor.iroru \
            --expected-version "$EXPECTED_VERSION" \
            --base-version-code "$ANDROID_BASE_VERSION_CODE" \
            --signing-policy release \
            --signing-configured "$SIGNING_CONFIGURED"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-android
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Android GitHub Release
    needs:
      - prepare
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android release artifacts
        uses: actions/download-artifact@v6
        with:
          name: release-assets-android
          path: release-assets

      - name: Verify and publish Android release atomically
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          APK_NAME: ${{ needs.android.outputs.apk_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
        run: |
          set -euo pipefail

          expected=(
            "$APK_NAME"
          )

          for asset in "${expected[@]}"; do
            path="release-assets/$asset"
            if [ ! -s "$path" ]; then
              echo "::error::Missing or empty Android release asset: $asset"
              exit 1
            fi
          done

          release_json="$(gh api --method POST "repos/${GH_REPO}/releases" \
            -f "tag_name=${TAG}" \
            -f "target_commitish=${RELEASE_COMMIT}" \
            -f "name=${TAG}" \
            -f "body=${RELEASE_NOTES}" \
            -F 'draft=true' \
            -F 'prerelease=false')"
          release_id="$(jq -r '.id // empty' <<< "$release_json")"
          if [ -z "$release_id" ]; then
            echo "::error::GitHub did not return a usable draft release id."
            printf '%s\n' "$release_json"
            exit 1
          fi

          cleanup_draft() {
            status="$1"
            trap - ERR INT TERM
            gh api --method DELETE "repos/${GH_REPO}/releases/${release_id}" >/dev/null 2>&1 || true
            if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GH_REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap 'cleanup_draft $?' ERR
          trap 'cleanup_draft 130' INT
          trap 'cleanup_draft 143' TERM

          for asset in "${expected[@]}"; do
            asset_name="$(basename "$asset")"
            for attempt in 1 2 3; do
              echo "Uploading $asset_name (attempt $attempt/3)"
              # A failed upload can leave a same-name starter asset in this draft.
              if gh release upload "$TAG" "release-assets/$asset" --repo "$GH_REPO" --clobber; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to upload $asset_name after 3 attempts."
                false
              fi
              sleep $((attempt * 5))
            done
          done

          remote_assets="$(gh api "repos/${GH_REPO}/releases/${release_id}" \
            --jq '.assets[] | [.name, .size, .state] | @tsv')"
          mapfile -t uploaded < <(
            printf '%s\n' "$remote_assets" |
              awk -F '\t' '$2 > 0 && $3 == "uploaded" { print $1 }' |
              sort
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)

          if [ "${#uploaded[@]}" -ne "${#expected_sorted[@]}" ]; then
            echo "::error::Android draft release contains an unexpected number of complete assets."
            printf 'Expected: %s\n' "${expected_sorted[*]}"
            printf 'Uploaded: %s\n' "${uploaded[*]}"
            false
          fi
          for index in "${!expected_sorted[@]}"; do
            if [ "${uploaded[$index]}" != "${expected_sorted[$index]}" ]; then
              echo "::error::Android draft release assets do not match the expected set."
              printf 'Expected: %s\n' "${expected_sorted[*]}"
              printf 'Uploaded: %s\n' "${uploaded[*]}"
              false
            fi
          done

          gh api --method PATCH "repos/${GH_REPO}/releases/${release_id}" \
            -F 'draft=false' \
            -F 'make_latest=true' >/dev/null
          trap - ERR INT TERM
