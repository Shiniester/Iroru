name: Build Android Beta and Pre-release
run-name: 'Android Beta ${{ inputs.version }} (branch: ${{ github.ref_name }})'

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_notes:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      RELEASE_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version, for example 4.5.3-beta.1 or v4.5.3-beta.1'
        required: true
        type: string
      release_notes:
        description: 'Beta release notes in Markdown'
        required: false
        default: 'Android beta for testing.'
        type: string
      commit_sha:
        description: 'Exact 40-character commit SHA to release (defaults to the workflow dispatch commit)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'kikoflu-release' || format('kikoflu-build-beta-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

jobs:
  native-audio:
    name: Build Android Native Audio Libraries
    uses: ./.github/workflows/native_audio.yml
    with:
      commit_sha: ${{ inputs.commit_sha || github.sha }}
      android_only: true
      android_all_abis: false

  android:
    name: Build Android Beta APKs
    needs: native-audio
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit_sha: ${{ steps.resolve_commit.outputs.commit_sha }}
      apk_name: ${{ steps.package.outputs.apk_name }}
    steps:
      - name: Validate selected release commit
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_COMMIT_SHA" ] && [[ ! "$INPUT_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::commit_sha must be a full 40-character commit SHA.'
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Verify selected release source configuration
        run: |
          set -euo pipefail
          gate="scripts/ci/validate_release_source.py"
          if [[ ! -f "$gate" ]]; then
            echo '::error::Selected commit predates the required release configuration. Choose a commit that includes the new release configuration.'
            exit 1
          fi
          python3 "$gate" android --root .

      - name: Download Android libmpv artifacts
        uses: actions/download-artifact@v6
        with:
          name: native-audio-android
          path: build/native-audio/android-output

      - name: Resolve selected release commit
        id: resolve_commit
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Show Beta Branch
        env:
          SELECTED_COMMIT_SHA: ${{ steps.resolve_commit.outputs.commit_sha }}
        run: |
          printf 'Branch: %s\nWorkflow event SHA (github.sha): %s\nSelected release commit: %s\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$SELECTED_COMMIT_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate Beta Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.[1-9][0-9]*$ ]]; then
            echo '::error::Version must use MAJOR.MINOR.PATCH-beta.N, for example 4.5.3-beta.1.'
            exit 1
          fi
          if ! latest_stable_tag="$(gh api "repos/${GH_REPO}/releases/latest" --jq '.tag_name' 2>/dev/null)"; then
            echo '::error::No published stable release found; cannot choose a Beta version base.'
            exit 1
          fi
          latest_stable="${latest_stable_tag#v}"
          build_number="$(python3 scripts/ci/android_release.py version-code \
            --version "$version" --latest-stable "$latest_stable")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1 ||
             gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag or release $tag already exists. Choose a new beta version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Prepare Android Signing
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Required Android signing secret $secret_name is missing."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          test -s android/app/release-key.jks
          cat <<EOF > android/key.properties
          storeFile=app/release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/app/release-key.jks android/key.properties
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true
          pub-cache: true

      - name: Cache Android Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ runner.arch }}-java-17-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}

      - name: Get Dependencies
        run: flutter pub get

      - name: Prepare Gradle Wrapper
        run: |
          set -euo pipefail
          flutter build apk --config-only --no-pub
          cd android
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo '::error::Gradle wrapper failed after 3 attempts.'
              exit 1
            fi
            delay=$((attempt * 5))
            echo "Gradle wrapper failed; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Build Android Beta APKs
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          mkdir -p dist
          flutter build apk --release --target-platform android-arm64 --split-per-abi --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          apk_name="$(python3 scripts/ci/android_release.py name \
            --version "$VERSION" \
            --package-id com.meteor.iroru)"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/$apk_name"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Verify Beta Packages
        env:
          APK_NAME: ${{ steps.package.outputs.apk_name }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          SIGNING_CONFIGURED: ${{ steps.android_signing.outputs.configured }}
        run: |
          set -euo pipefail
          arm64_apk="dist/$APK_NAME"
          shopt -s nullglob
          apks=(dist/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [ "${apks[0]}" != "$arm64_apk" ]; then
            echo "::error::Expected exactly one arm64 Beta APK, found: ${apks[*]}"
            exit 1
          fi
          python3 scripts/ci/android_release.py verify \
            --apk "$arm64_apk" \
            --package-id com.meteor.iroru \
            --expected-version "$EXPECTED_VERSION" \
            --base-version-code "$EXPECTED_BUILD_NUMBER" \
            --signing-policy release \
            --signing-configured "$SIGNING_CONFIGURED" \
            --forbid-debuggable

      - name: Upload Beta Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: beta-assets-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish Android Pre-release
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: beta-assets-android
          path: release-assets

      - name: Publish Beta with the arm64 APK
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          APK_NAME: ${{ needs.android.outputs.apk_name }}
          TAG: ${{ needs.android.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.android.outputs.commit_sha }}
          RELEASE_NOTES: |-
            ${{ inputs.release_notes }}

            旧下载目录中的音声和视频仍保存在原处。如需在新版离线播放，请重新下载。
            如果旧版 Android 应用找不到此 Beta，请手动安装本页的 APK。
        run: |
          set -euo pipefail
          assets=(
            "release-assets/${APK_NAME}"
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          printf '%s\n\nBranch: %s\nWorkflow event SHA (github.sha): %s\nSelected release commit: %s\n\n%s\n' \
            'Android Beta: install this APK to run the Beta release of Iroru. This installation uses its own app data and does not import data from the previous standalone Iroru Beta app. The previous app and its data remain on the device.' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$RELEASE_COMMIT" \
            "$RELEASE_NOTES" > "$RUNNER_TEMP/beta-release-notes.md"
          gh release create "$TAG" --target "$RELEASE_COMMIT" \
            --title "Iroru $TAG" --notes-file "$RUNNER_TEMP/beta-release-notes.md" \
            --draft --prerelease --latest=false
          for asset in "${assets[@]}"; do
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$asset" --clobber; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo '::error::APK upload failed; the release remains a draft.'
                exit 1
              fi
              sleep $((attempt * 5))
            done
          done
          # Resolve drafts through the CLI; the release-by-tag endpoint returns 404 before publication.
          gh release view "$TAG" --json assets --jq '.assets' > "$RUNNER_TEMP/beta-assets.json"
          jq -e 'length == 1 and all(.[]; .size > 0 and .state == "uploaded")' \
            "$RUNNER_TEMP/beta-assets.json" >/dev/null
          gh release edit "$TAG" --draft=false --prerelease --latest=false
          gh release view "$TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
